name: Native FFI Build

# Builds the vendored native/aa-ffi-go shim (a thin C-ABI over the SHA-pinned
# aa-sdk-client) and exercises the real cgo binding (-tags aa_ffi_go). The
# default Go test matrix never sets this tag, so this is the only lane that
# compiles + links the native path (AAASM-2704).

on:
  pull_request:
    paths:
      - "native/**"
      - "internal/ffi/**"
      - "Makefile"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/native-ffi.yml"
  push:
    branches:
      - main
    paths:
      - "native/**"
      - "internal/ffi/**"
      - "Makefile"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/native-ffi.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  native-cgo:
    name: Build native shim + cgo tests
    runs-on: ubuntu-latest
    env:
      # AAASM-4709: pin this job onto the go1.26.6 toolchain, the same one
      # govulncheck.yml/release.yml's security-gate already force (see the
      # AAASM-4634 comment there). Without this, `go` resolves to whatever
      # actions/setup-go's `go-version: "1.26.x"` cached (the 1.26.4 toolcache)
      # and `make test-native`'s `go build`/`go test` run outbound TLS on a
      # stdlib still vulnerable to GO-2026-5856.
      GOTOOLCHAIN: go1.26.6
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      # AAASM-6215: see .github/actions/setup-protoc — declared version,
      # checksum-verified bytes, retrying download, no release-API lookup.
      - name: Install protoc
        uses: ./.github/actions/setup-protoc

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.x"

      - name: Build native/aa-ffi-go + run cgo-tagged tests
        run: make test-native
